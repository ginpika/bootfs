name: Docker Build and Verify

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      no-cache:
        description: '禁用 Docker 缓存（勾选后强制完整重建）'
        type: boolean
        default: false

permissions:
  contents: read

# Keep publications running; only superseded PR checks can be cancelled.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      repository: ${{ steps.names.outputs.repository }}
      candidate: ${{ steps.names.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare image names
        id: names
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "candidate=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Validate workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Check container smoke script
        run: shellcheck -s sh scripts/smoke-container.sh
      - name: Set up Java for kernel and integration tests
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify embedded kernel and resource lifecycle
        run: mvn -B -ntp test

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.repository }}
      CANDIDATE: ${{ needs.verify.outputs.candidate }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU for ARM64
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for container checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: bootfs:smoke
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: ${{ !inputs.no-cache && format('type=gha,scope=bootfs-{0}', matrix.arch) || '' }}
          cache-to: ${{ !inputs.no-cache && format('type=gha,scope=bootfs-{0},mode=max', matrix.arch) || '' }}
          no-cache: ${{ inputs.no-cache == true }}
      - name: Verify startup, file upload, search, and persistence
        run: sh scripts/smoke-container.sh bootfs:smoke linux/${{ matrix.arch }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested candidate
        if: github.event_name != 'pull_request'
        run: |
          docker tag bootfs:smoke "$IMAGE:$CANDIDATE"
          docker push "$IMAGE:$CANDIDATE"

  publish:
    if: github.event_name != 'pull_request'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # All refs share release aliases, so promote them under one lock.
    concurrency:
      group: bootfs-ghcr-publish
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ needs.verify.outputs.repository }}
      CANDIDATE: ${{ needs.verify.outputs.candidate }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check branch freshness under the publication lock
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=false
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')
            if [[ "$head" == "$GITHUB_SHA" ]]; then current=true; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch,enable=${{ steps.fresh.outputs.current == 'true' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.fresh.outputs.current == 'true' && github.ref_name == github.event.repository.default_branch }}
      - name: Assemble and verify both architectures
        run: |
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:$CANDIDATE-amd64" "$IMAGE:$CANDIDATE-arm64"
          docker buildx imagetools inspect --raw "$IMAGE:sha-$GITHUB_SHA" | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
      - name: Promote tested revision
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" && "$tag" != "$IMAGE:sha-$GITHUB_SHA" ]]; then
              args+=(--tag "$tag")
            fi
          done <<< "$RELEASE_TAGS"
          if (( ${#args[@]} )); then
            docker buildx imagetools create "${args[@]}" "$IMAGE:sha-$GITHUB_SHA"
          fi
          echo "Both architectures passed container checks. Deploy with BOOTFS_IMAGE=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
