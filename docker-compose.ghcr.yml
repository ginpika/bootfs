# Build and publish THIS revision before selecting BOOTFS_IMAGE; older images use the legacy deployment.
services:
  app:
    image: ${BOOTFS_IMAGE:?Set BOOTFS_IMAGE to an image built from this revision}
    ports:
      - "8181:8181"
    volumes:
      - data:/data
    environment:
      TFS_ROOT_PATH: /data
      TFS_WEB_ENTRYPOINT: ${TFS_WEB_ENTRYPOINT:-http://localhost:8181}
      TFS_COPIES: ${TFS_COPIES:-1}
      SSO_ENABLED: ${SSO_ENABLED:-true}
      SSO_SERVER_URL: ${SSO_SERVER_URL:-http://localhost:3001}
      SSO_INFO_URL: ${SSO_INFO_URL:-http://localhost:3000/sso/info}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bootfs}
      BOOTFS_CLUSTER_TOKEN: ${BOOTFS_CLUSTER_TOKEN:-}
      BOOTFS_METADATA_MODE: ${BOOTFS_METADATA_MODE:-embedded}
      BOOTFS_CLUSTER_DISCOVERY_ENABLED: ${BOOTFS_CLUSTER_DISCOVERY_ENABLED:-true}
      BOOTFS_CLUSTER_RAFT_ADDRESS: ${BOOTFS_CLUSTER_RAFT_ADDRESS:-}
      BOOTFS_RAFT_ALLOW_INSECURE_NETWORK: ${BOOTFS_RAFT_ALLOW_INSECURE_NETWORK:-false}
      BOOTFS_OBJECT_WRITE_POLICY: ${BOOTFS_OBJECT_WRITE_POLICY:-single-local}
      BOOTFS_OBJECT_REQUIRED_COPIES: ${BOOTFS_OBJECT_REQUIRED_COPIES:-0}
      BOOTFS_OBJECT_PREPARE_TIMEOUT_MS: ${BOOTFS_OBJECT_PREPARE_TIMEOUT_MS:-30000}
volumes:
  data:
