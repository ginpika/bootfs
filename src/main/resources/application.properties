server.port=8181
# Ordinary business and proxy properties come from nodeDatabaseSettings before server initialization.
spring.servlet.multipart.max-file-size=4096MB
spring.servlet.multipart.max-request-size=4096MB
spring.servlet.multipart.resolve-lazily=true
spring.jackson.default-property-inclusion=non_null
tfs.root-path=${TFS_ROOT_PATH:./bootfs}
tfs.ffmpeg-url=${TFS_FFMPEG_URL:ffmpeg}
tfs.thumbnail-width=480
tfs.thumbnail-quality=80
# New and existing local embedded storage use autonomous local authority.
bootfs.metadata.mode=${BOOTFS_METADATA_MODE:auto}
bootfs.cluster.token=${BOOTFS_CLUSTER_TOKEN:}
s3.region=${S3_REGION:us-east-1}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Only legacy static Raft uses this network switch; local federation needs HTTP/HTTPS only.
bootfs.raft.allow-insecure-network=${BOOTFS_RAFT_ALLOW_INSECURE_NETWORK:false}
