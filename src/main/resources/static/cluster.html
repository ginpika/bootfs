<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BootFS · 节点组网</title>
<style>body{font:16px system-ui,sans-serif;background:#f6f8fa;color:#18232d;max-width:850px;margin:48px auto;padding:0 24px}a{color:#087e67}section{background:white;border:1px solid #dce4e6;border-radius:14px;padding:24px;margin:20px 0}h1{font-size:28px}h2{font-size:19px}button,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid #bac8cc}button{background:#087e67;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{min-width:260px}li{margin:12px 0;overflow-wrap:anywhere}small,p{line-height:1.7;color:#52636d}#message{white-space:pre-wrap}#leave{background:white;color:#ad432e}code{overflow-wrap:anywhere}</style></head>
<body><a href="/">← 返回资源库</a><h1>节点组网</h1><p>使用相同组网密钥的节点可以在局域网内自动发现并连接。已有内容留在原节点，冲突资源按版本保留。</p>
<section><h2 id="state">正在读取节点状态…</h2><p id="identity"></p><ul id="members"></ul><p id="message" role="status"></p><button id="leave">安全下线本节点</button><p>安全下线会先调整在线成员。剩余在线副本决定对象能否继续读取；停止多数成员后，集群将暂停写入。重启本节点会重新加入。</p></section>
<section><h2>连接其他节点</h2><form id="connect"><input id="endpoint" type="url" required placeholder="http://另一节点:8181" aria-label="另一节点的地址"> <button>连接</button></form><p>跨网段或网络不支持自动发现时，输入任一集群节点的地址。</p><ul id="discovered"></ul></section>
<section><h2>查阅冲突版本</h2><form id="versions"><label>资源类型 <select id="namespace"><option value="s3">S3 key</option><option value="resource">资源 UUID</option><option value="metadata">其他元数据 key</option></select></label> <input id="version-key" required placeholder="/s3/bootfs/对象名 或 UUID" aria-label="版本资源键"> <button>查看</button></form><ul id="version-list"></ul></section>
<script src="/cluster.js"></script></body></html>
