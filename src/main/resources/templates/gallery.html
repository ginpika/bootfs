<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('tfs-theme') || 'light';
            const root = document.documentElement;
            root.className = '';
            root.classList.add(`theme-${savedTheme}`);
        }

        initTheme();
        window.__galleryUrls = fetch('/setu-urls?count=240', { headers: { Accept: 'application/json' } });
    </script>
    <script src="/security-utils.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/themes.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        .container {
            width: 120vw;
            margin: 0 auto;
            padding: 20px;
            height: 200vh;
            position:relative;
            right: 200px;
            bottom: 500px;
            display:none;
        }

        .gallery {
            display: flex;
            gap: 15px;
            height: 100%;
            transform: rotate(-25deg) scale(1.4) translateX(100px);
            position: relative;
            left: 50px;
        }

        .column {
            flex: 1;
            overflow: hidden;
            position: relative;
            border-radius: var(--radius-surface);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background-color: var(--color-bg-secondary);
        }

        .imageScroll {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .image-container {
            width: 100%;
            border-radius: var(--radius-control);
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: var(--color-bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .image-container img {
            width: 100%;
            display: block;
            height: auto;
            min-height: 200px;
            object-fit: cover;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-border-primary);
            border-radius: 50%;
            border-top-color: var(--color-accent-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1100px) {
            .gallery {
                flex-wrap: wrap;
            }

            .column {
                flex: 0 0 calc(33.333% - 15px);
                height: 450px;
            }
        }

        @media (max-width: 768px) {
            .column {
                flex: 0 0 calc(50% - 15px);
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            .column {
                flex: 0 0 100%;
                height: 350px;
            }
        }

        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 120px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: var(--radius-surface);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-border-secondary);
            border-top: 4px solid var(--color-accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader p {
            margin-top: 10px;
            font-family: 'Outfit', sans-serif;
            color: var(--color-text-tertiary);
            font-size: 14px;
        }

        #bp_container > .bp-x {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        #empty-state {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg-primary);
        }

        #empty-state.hidden { display: none; }

        #empty-state .empty-copy { text-align: center; }

        #empty-state .hero {
            width: 6rem;
            height: 6rem;
            margin: 0 auto;
            color: var(--color-text-quaternary);
        }

        #empty-state h3 {
            margin-top: 1.5rem;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--color-text-primary);
        }

        #empty-state p {
            margin-top: 0.75rem;
            max-width: 28rem;
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
        }

        #empty-state .empty-action { margin-top: 2rem; }

        #empty-state .theme-btn-primary svg {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 0.5rem;
        }

    </style>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <script src="https://cdn.jsdelivr.net/npm/bigpicture@2.6.2/dist/BigPicture.min.js" defer></script>
</head>

<body>
<div id="empty-state" class="hidden">
    <div class="empty-copy">
        <svg class="hero" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <h3>暂无公开图片</h3>
        <p>还没有公开的图片，快去管理页面上传并发布一些吧！</p>
        <div class="empty-action">
            <a href="/" class="theme-btn-primary">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
                前往管理页面
            </a>
        </div>
    </div>
</div>
<div class="container">
    <div class="gallery" id="gallery"></div>
</div>
<div id="loader">
    <div class="spinner"></div>
    <p style="color:white;">少女祈祷中...</p>
</div>
</body>

<footer>
    <script src="/jquery.min.js"></script>
    <script>
        (function () {
            const gallery = document.getElementById('gallery');

            // 列配置
            const COLUMN_COUNT = 8;
            const IMAGES_PER_COLUMN = 30;
            const TOTAL = COLUMN_COUNT * IMAGES_PER_COLUMN;
            const SCROLL_SPEED = 0.2; // 像素/帧

            // 状态管理
            let columns = [];
            let scrollSpeed = SCROLL_SPEED;

            // 创建列
            function createColumns() {
                for (let i = 0; i < COLUMN_COUNT; i++) {
                    const column = document.createElement('div');
                    column.className = 'column';

                    const imageScroll = document.createElement('div');
                    imageScroll.className = 'imageScroll';
                    imageScroll.id = `imageScroll-${i}`;

                    if (i % 2 === 1) {
                        imageScroll.style.position = `relative`;
                        imageScroll.style.top = `-4300px`
                    } else {
                        imageScroll.style.position = `relative`;
                        imageScroll.style.top = `0px`
                    }

                    column.appendChild(imageScroll);
                    gallery.appendChild(column);

                    // 存储列信息
                    columns.push({
                        element: imageScroll,
                        direction: i % 2 === 0 ? 'up' : 'down',
                        position: 0,
                        maxPosition: 0,
                        minPosition: 0,
                        bouncing: false
                    });

                }
            }

            function failedTile() {
                const errorDiv = document.createElement('div');
                errorDiv.textContent = '加载失败';
                errorDiv.style.color = '#e74c3c';
                errorDiv.style.textAlign = 'center';
                errorDiv.style.padding = '20px';
                return errorDiv;
            }

            // 地址一次取齐，缩略图同时开始下载。先出来的几张就揭开画廊，其余格子继续填。
            function mountImages(urls) {
                let settled = 0;
                let revealed = false;
                const revealAt = Math.min(COLUMN_COUNT, urls.length);

                function reveal() {
                    if (revealed) return;
                    revealed = true;
                    $($(".container")[0]).fadeIn(600);
                    $("#loader").hide();
                }

                urls.forEach((res, index) => {
                    const columnIndex = Math.floor(index / IMAGES_PER_COLUMN);
                    const imageScroll = document.getElementById(`imageScroll-${columnIndex}`);
                    const container = document.createElement('div');
                    container.className = 'image-container';
                    const spinner = document.createElement('div');
                    spinner.className = 'loading-spinner';
                    container.appendChild(spinner);
                    imageScroll.appendChild(container);

                    const uuid = res.substring(res.lastIndexOf('/') + 1).split(/[?#]/)[0];
                    const img = new Image();
                    img.decoding = 'async';
                    img.alt = '随机图片';
                    if (index < COLUMN_COUNT) img.fetchPriority = 'high';

                    function settle() {
                        if (++settled >= revealAt) reveal();
                    }

                    img.onload = function () {
                        container.replaceChildren(img);
                        settle();
                    };

                    img.onerror = function () {
                        if (!img.dataset.fallback && res.indexOf('/thumb/') === -1) {
                            img.dataset.fallback = '1';
                            img.src = res;
                            return;
                        }
                        container.replaceChildren(failedTile());
                        settle();
                    };

                    img.onclick = function () {
                        if (typeof BigPicture === 'function') BigPicture({ el: this, imgSrc: res });
                    };

                    img.src = '/thumb/' + uuid;
                });

                setTimeout(reveal, 800);
            }

            function showEmptyState() {
                $("#loader").hide();
                $(".container").hide();
                $("#empty-state").removeClass("hidden");
            }

            // 动画循环
            function animate() {
                columns.forEach((column, index) => {
                    const imageScroll = column.element;
                    const columnHeight = imageScroll.parentElement.offsetHeight;
                    const contentHeight = imageScroll.scrollHeight;

                    // 计算最大和最小位置

                    if (index % 2 === 0) {
                        column.maxPosition = 0;
                        column.minPosition = -4300;

                        if (column.direction === 'up') {
                            column.position -= scrollSpeed;

                            // 检查是否需要反弹
                            if (column.position <= column.minPosition) {
                                column.direction = 'down';
                                column.bouncing = true;
                            } else if (column.position >= column.maxPosition) {
                                column.direction = 'up';
                                column.bouncing = true;
                            }
                        } else {
                            // 奇数列
                            column.position += scrollSpeed;

                            // 检查是否需要反弹
                            if (column.position >= column.maxPosition) {
                                column.direction = 'up';
                                column.bouncing = true;
                            } else if (column.position <= column.minPosition) {
                                column.direction = 'down';
                                column.bouncing = true;
                            }
                        }
                    } else {
                        column.maxPosition = 4300;
                        column.minPosition = 0;
                        if (column.direction === 'up') {
                            column.position -= scrollSpeed;

                            // 检查是否需要反弹
                            if (column.position <= column.minPosition) {
                                column.direction = 'down';
                                column.bouncing = true;
                            } else if (column.position >= column.maxPosition) {
                                column.direction = 'up';
                                column.bouncing = true;
                            }
                        } else {
                            column.position += scrollSpeed;

                            // 检查是否需要反弹
                            if (column.position >= column.maxPosition) {
                                column.direction = 'up';
                                column.bouncing = true;
                            } else if (column.position <= column.minPosition) {
                                column.direction = 'down';
                                column.bouncing = true;
                            }
                        }
                    }

                    // 应用变换
                    imageScroll.style.transform = `translateY(${column.position}px)`;
                });

                requestAnimationFrame(animate);
            }

            createColumns();
            animate();

            const pending = window.__galleryUrls || fetch('/setu-urls?count=' + TOTAL, { headers: { Accept: 'application/json' } });
            pending
                .then(function (response) {
                    if (response.status === 404) {
                        showEmptyState();
                        return null;
                    }
                    if (!response.ok) throw new Error('gallery');
                    return response.json();
                })
                .then(function (urls) {
                    if (!urls) return;
                    if (!urls.length) {
                        showEmptyState();
                        return;
                    }
                    mountImages(urls.slice(0, TOTAL));
                })
                .catch(function () {
                    const label = document.querySelector('#loader p');
                    if (label) label.textContent = '画廊加载失败';
                });
        })();
    </script>
</footer>
</html>
