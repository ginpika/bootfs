<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n>TV 节目单管理</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        try {
            document.documentElement.classList.add('theme-' + (localStorage.getItem('tfs-theme') || 'light'));
        } catch {}
    </script>
    <link rel="stylesheet" href="/themes.css">
    <link rel="stylesheet" href="/language-picker.css">
    <link rel="stylesheet" href="/tv-manage.css">
    <script defer src="/i18n/en.js"></script>
    <script defer src="/i18n.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script defer src="/tv-manage.js"></script>
</head>
<body class="schedule-page">
    <header class="schedule-topbar">
        <div class="schedule-toolbar">
            <a href="/" class="theme-icon-btn" data-i18n-attrs="title aria-label" title="回到首页" aria-label="回到首页">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-2m-7 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1"></path>
                </svg>
            </a>
            <div class="schedule-filters">
                <div class="schedule-search">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input id="videoSearch" class="theme-input" type="search" placeholder="搜索视频…" aria-label="搜索视频…"
                           data-i18n-attrs="placeholder aria-label" autocomplete="off" disabled>
                </div>
                <select id="sourceFilter" class="theme-input" data-i18n-attrs="aria-label" aria-label="来源节点" disabled>
                    <option value="" data-i18n>所有节点</option>
                </select>
            </div>
            <div class="schedule-toolbar-actions">
                <div th:replace="fragments/language-picker :: picker"></div>
                <a href="/tv" class="theme-btn-secondary" data-i18n>前往 TV</a>
                <button id="saveSchedule" class="theme-btn-primary" type="button" data-i18n disabled>保存节目单</button>
            </div>
        </div>
    </header>

    <main class="schedule-main">
        <div class="schedule-heading">
            <h1 data-i18n>TV 节目单管理</h1>
            <p id="saveStatus" class="schedule-feedback" role="status"></p>
        </div>
        <div id="loadNotice" class="schedule-notice theme-card theme-rounded-xl" hidden>
            <span data-i18n role="status">加载视频列表失败</span>
            <button class="theme-btn-secondary theme-btn-sm" id="retryLoad" type="button" data-i18n>重试</button>
        </div>

        <div class="schedule-panels">
            <section class="schedule-panel theme-card theme-rounded-xl" aria-labelledby="availableTitle">
                <div class="schedule-panel-heading">
                    <div class="schedule-panel-title">
                        <h2 id="availableTitle" data-i18n>可选视频</h2>
                        <span id="availableCount" class="schedule-count"></span>
                    </div>
                    <button id="addAll" class="theme-btn-secondary theme-btn-sm" type="button" data-i18n disabled>添加全部</button>
                </div>
                <div class="schedule-columns" aria-hidden="true">
                    <span class="schedule-file-column" data-i18n>视频信息</span>
                    <span data-i18n>时长</span>
                    <span data-i18n>操作</span>
                </div>
                <ul id="availableList" class="schedule-list" role="list">
                    <li class="schedule-empty" data-i18n>加载中...</li>
                </ul>
            </section>

            <section class="schedule-panel theme-card theme-rounded-xl" aria-labelledby="playlistTitle">
                <div class="schedule-panel-heading">
                    <div class="schedule-panel-title">
                        <h2 id="playlistTitle" data-i18n>播放列表</h2>
                        <span id="playlistCount" class="schedule-count"></span>
                    </div>
                    <button id="clearSchedule" class="theme-btn-secondary theme-btn-sm" type="button" data-i18n disabled>清空</button>
                </div>
                <div class="schedule-columns schedule-queue" aria-hidden="true">
                    <span data-i18n>顺序</span>
                    <span data-i18n>视频信息</span>
                    <span data-i18n>时长</span>
                    <span data-i18n>操作</span>
                </div>
                <ol id="playlistList" class="schedule-list schedule-queue" role="list">
                    <li class="schedule-empty" data-i18n>加载中...</li>
                </ol>
                <footer id="playlistStats" class="schedule-summary" hidden></footer>
            </section>
        </div>
    </main>

    <template id="videoRow">
        <li class="schedule-row" tabindex="-1">
            <span class="schedule-video-icon theme-rounded-lg" aria-hidden="true">
                <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <circle cx="12" cy="12" r="9"></circle>
                </svg>
            </span>
            <span class="schedule-position" hidden>
                <svg class="schedule-grip" width="15" height="18" fill="currentColor" viewBox="0 0 16 20" aria-hidden="true">
                    <circle cx="5" cy="4" r="1.25"></circle><circle cx="11" cy="4" r="1.25"></circle>
                    <circle cx="5" cy="10" r="1.25"></circle><circle cx="11" cy="10" r="1.25"></circle>
                    <circle cx="5" cy="16" r="1.25"></circle><circle cx="11" cy="16" r="1.25"></circle>
                </svg>
                <span class="schedule-order"></span>
            </span>
            <div class="schedule-file">
                <span class="schedule-filename" dir="auto"></span>
                <span class="schedule-source"></span>
            </div>
            <span class="schedule-duration"></span>
            <div class="schedule-row-actions">
                <button type="button" class="theme-icon-btn theme-btn-sm" data-action="add">
                    <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                </button>
                <button type="button" class="theme-icon-btn theme-btn-sm" data-action="up" hidden>
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"></path></svg>
                </button>
                <button type="button" class="theme-icon-btn theme-btn-sm" data-action="down" hidden>
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"></path></svg>
                </button>
                <button type="button" class="theme-icon-btn theme-btn-sm" data-action="remove" hidden>
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg>
                </button>
            </div>
        </li>
    </template>
</body>
</html>
