<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootFS TV</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        try {
            document.documentElement.classList.add('theme-' + (localStorage.getItem('tfs-theme') || 'light'));
        } catch {}
    </script>
    <link rel="stylesheet" href="/themes.css">
    <link rel="stylesheet" href="https://vjs.zencdn.net/8.23.4/video-js.min.css">
    <link rel="stylesheet" href="/tv.css">
    <script defer src="/security-utils.js"></script>
    <script defer src="/i18n/en.js"></script>
    <script defer src="/i18n.js"></script>
    <script defer src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
    <script defer src="/tv.js"></script>
</head>
<body class="tv-page">
    <header class="tv-topbar">
        <div class="tv-topbar-inner">
            <div class="tv-brand">
                <a href="/" class="theme-btn-secondary theme-btn-sm">
                    <span data-i18n>首页</span>
                </a>
                <h1>BootFS TV</h1>
            </div>
            <a href="/tv/manage" class="theme-btn-secondary theme-btn-sm">
                <span data-i18n>节目单管理</span>
            </a>
        </div>
    </header>
    <main class="tv-layout">
        <section class="tv-panel tv-broadcast" aria-labelledby="broadcastTitle">
            <div class="tv-panel-heading">
                <div class="tv-heading-group">
                    <h2 id="broadcastTitle" data-i18n>直播</h2>
                    <span id="streamBadge" class="tv-badge" th:classappend="${stats.live} ? 'is-live' : ''">
                        <span class="tv-status-dot" aria-hidden="true"></span>
                        <span id="streamState" data-i18n th:text="${stats.live} ? '直播中' : '未开播'">未开播</span>
                    </span>
                </div>
                <button id="danmakuToggle" class="theme-btn-secondary theme-btn-sm" type="button" aria-pressed="true">
                    <span data-i18n>弹幕</span>
                </button>
            </div>
            <div class="tv-stage" id="tvStage">
                <video id="tvPlayer" class="video-js vjs-big-play-centered" controls playsinline preload="none" muted
                       data-i18n-attrs="aria-label" aria-label="直播播放器"></video>
                <div class="tv-stage-placeholder" id="streamPlaceholder">
                    <span class="tv-stage-symbol" aria-hidden="true"></span>
                    <p id="streamNotice" data-i18n>暂无直播节目</p>
                    <button id="streamRetry" class="theme-btn-secondary theme-btn-sm" type="button" hidden>
                        <span data-i18n>重试</span>
                    </button>
                </div>
                <div id="danmakuLayer" class="tv-danmaku-layer" aria-hidden="true"></div>
            </div>
            <div class="tv-program">
                <div class="tv-program-title">
                    <span class="tv-label" data-i18n>当前节目</span>
                    <strong id="programTitle" th:text="${stats['currentProgram'] != null ? stats['currentProgram']['fileName'] : '—'}">—</strong>
                    <span id="programNode" class="tv-label"></span>
                </div>
                <dl class="tv-program-stats">
                    <div><dt data-i18n>节目数</dt><dd id="programCount" th:text="${stats.playlistSize}">0</dd></div>
                    <div><dt data-i18n>总时长</dt><dd id="programDuration" th:attr="data-duration-seconds=${stats.totalDuration}">0</dd></div>
                </dl>
            </div>
        </section>

        <aside class="tv-panel tv-chat" aria-labelledby="chatTitle">
            <div class="tv-panel-heading">
                <div class="tv-heading-group">
                    <h2 id="chatTitle" data-i18n>聊天室</h2>
                </div>
                <span id="chatConnection" class="tv-label" role="status"></span>
            </div>
            <div id="chatLog" class="tv-chat-log" role="log" aria-labelledby="chatTitle" tabindex="0">
                <div id="chatEmpty" class="tv-chat-empty">
                    <p id="chatEmptyText" data-i18n>正在载入聊天…</p>
                </div>
                <ol id="chatMessages" class="tv-chat-messages"></ol>
            </div>
            <div class="tv-chat-footer">
                <div id="chatGuest" class="tv-chat-guest">
                    <span id="chatHint" class="tv-label" role="status" data-i18n>正在检查登录状态…</span>
                    <a id="chatLogin" class="theme-btn-secondary theme-btn-sm" hidden data-i18n>SSO 登录</a>
                </div>
                <form id="chatForm" class="tv-chat-form" hidden>
                    <label class="tv-sr-only" for="chatInput" data-i18n>发送聊天消息</label>
                    <input class="theme-input" id="chatInput" type="text" maxlength="240" th:maxlength="${messageLimit}"
                           autocomplete="off" required data-i18n-attrs="placeholder" placeholder="发条消息，也会显示为弹幕">
                    <button id="chatSend" class="theme-btn-primary" type="submit" disabled>
                        <span data-i18n>发送</span>
                    </button>
                </form>
                <p id="chatError" class="tv-chat-error" role="status" hidden></p>
            </div>
        </aside>
    </main>
</body>
</html>
