<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootFS</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link th:if="${uuid != null}" rel="stylesheet" href="https://vjs.zencdn.net/8.23.4/video-js.min.css">
    <link rel="stylesheet" th:href="@{/video-player.css}">
    <script defer th:src="@{/security-utils.js}"></script>
    <script defer th:src="@{/i18n/en.js}"></script>
    <script defer th:src="@{/i18n.js}"></script>
    <script th:if="${uuid != null}" defer src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
</head>

<body>
    <video th:if="${uuid != null}" id="vjs-player" class="video-js vjs-big-play-centered" controls playsinline preload="metadata"
           data-setup='{"fill": true, "responsive": true}'>
        <source th:if="${hls}" th:src="@{/hls/{uuid}/playlist.m3u8(uuid=${uuid})}"
                type="application/x-mpegURL">
        <source th:unless="${hls}" th:src="@{/p/{uuid}(uuid=${uuid})}" type="video/mp4">
    </video>
    <p th:if="${uuid == null}" class="embed-empty" data-i18n>视频不可用</p>
</body>
</html>
